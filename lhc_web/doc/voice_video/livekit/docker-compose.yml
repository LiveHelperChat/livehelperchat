# Self hosted LiveKit media server for Live Helper Chat Voice & Video & ScreenShare
# Docs: https://docs.livekit.io/home/self-hosting/deployment/
#
# 1. Point DNS of livekit.example.com (and turn.example.com) to this server
# 2. Replace domains in Caddyfile and livekit.yaml, generate API key/secret (see README.md)
# 3. docker compose up -d
services:
  livekit:
    image: livekit/livekit-server:v1.9
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    # Host networking is recommended for WebRTC UDP port range performance
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  # Required by egress (recording). LiveKit and egress communicate through it.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --bind 127.0.0.1 --protected-mode yes
    network_mode: host

  # Call recording. Remove if recording is not used.
  egress:
    image: livekit/egress:v1.10
    restart: unless-stopped
    network_mode: host
    # Egress has to run as uid 1001. Group = web server group (33 www-data on Ubuntu/Debian,
    # check `id -g nginx` / `id -g apache` on AlmaLinux) and umask 0002, so Live Helper Chat
    # can remove recordings (retention, chat deletion).
    user: "1001:33"
    entrypoint: ["/bin/bash", "-c", "umask 0002 && exec /entrypoint.sh"]
    cap_add:
      - SYS_ADMIN
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      # Recordings. The same directory has to be available to Live Helper Chat
      # ("Same directory on this server" in LHC recording configuration),
      # e.g. run LHC on the same host or mount it over NFS.
      - /var/lib/lhc-recordings:/out

  # TLS termination for wss://livekit.example.com -> 127.0.0.1:7880
  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
