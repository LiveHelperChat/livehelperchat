# LiveKit server configuration
# Full reference: https://github.com/livekit/livekit/blob/master/config-sample.yaml
port: 7880
bind_addresses:
  - "127.0.0.1"

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  # Fully self hosted: public IP is set explicitly, so no public STUN service
  # (LiveKit default is Google STUN) is contacted to discover it.
  use_external_ip: false
  node_ip: 203.0.113.10
  # STUN servers handed to browsers. Without this LiveKit gives browsers
  # Google and Twilio public STUN servers, exposing visitor IPs to them.
  # Built in TURN server below answers STUN requests too.
  stun_servers:
    - turn.example.com:3478

# Same key and secret has to be entered in Live Helper Chat
# System configuration -> Voice & Video & ScreenShare -> Configuration
keys:
  REPLACE_API_KEY: REPLACE_API_SECRET

# Built in TURN server, needed for visitors behind strict firewalls/corporate networks
turn:
  enabled: true
  domain: turn.example.com
  udp_port: 3478
  # TURN over TLS (port 5349) helps when only TCP/443-like traffic is allowed.
  # Uncomment and provide certificate for turn.example.com
  # tls_port: 5349
  # cert_file: /etc/livekit/turn.crt
  # key_file: /etc/livekit/turn.key

# Keeps Live Helper Chat call state and call history correct when a participant
# closes the browser, crashes or loses connection.
# URL is shown in Live Helper Chat Voice & Video configuration page.
webhook:
  api_key: REPLACE_API_KEY
  urls:
    - https://chat.example.com/index.php/voicevideo/webhook

room:
  # One chat = one room. Operator, visitor and supervisor
  max_participants: 5
  empty_timeout: 300

logging:
  level: info

# Required for recording (egress) and multi node (horizontal scaling) deployments
redis:
  address: 127.0.0.1:6379
